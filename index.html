<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mesa de Dados</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt-1:#123524;
    --felt-2:#0b2418;
    --tray:#1b4332;
    --ivory:#f2e8d5;
    --ink:#1b2a22;
    --brass:#c9a227;
    --brass-bright:#e6c65c;
    --ember:#e2572b;
    --parchment:#a9c2b0;
    --stitch: rgba(242,232,213,0.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Space Grotesk', sans-serif;
    background:
      radial-gradient(120% 90% at 50% -10%, var(--felt-1) 0%, var(--felt-2) 65%),
      var(--felt-2);
    color: var(--ivory);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 18px 16px 28px;
    overflow-x:hidden;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color: var(--brass);
    font-weight:600;
    margin-bottom:2px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:26px;
    margin:0 0 2px;
    color: var(--ivory);
  }
  .sub{
    font-size:12.5px;
    color: var(--parchment);
    margin-bottom:16px;
    text-align:center;
  }

  /* dice selector chips */
  .selector{
    display:flex;
    gap:8px;
    width:100%;
    max-width:480px;
    overflow-x:auto;
    padding: 4px 2px 12px;
    scrollbar-width:none;
  }
  .selector::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    width:58px;
    height:58px;
    border-radius:14px;
    border:1px solid rgba(242,232,213,0.14);
    background: rgba(255,255,255,0.03);
    color: var(--parchment);
    font-family:'Space Grotesk';
    font-weight:600;
    font-size:12.5px;
    cursor:pointer;
    transition: border-color .18s ease, background .18s ease, transform .18s ease, color .18s ease;
  }
  .chip svg{ width:20px; height:20px; }
  .chip.active{
    background: linear-gradient(160deg, rgba(201,162,39,0.22), rgba(201,162,39,0.06));
    border-color: var(--brass);
    color: var(--brass-bright);
    transform: translateY(-2px);
  }

  /* tray */
  .tray-wrap{
    position:relative;
    width:min(78vw, 300px);
    height:min(78vw, 300px);
    margin: 6px 0 18px;
  }
  .tray{
    position:absolute; inset:0;
    border-radius:50%;
    background: radial-gradient(circle at 50% 38%, var(--tray) 0%, var(--felt-2) 78%);
    box-shadow: inset 0 0 0 1px rgba(242,232,213,0.06), inset 0 10px 40px rgba(0,0,0,0.55);
  }
  .tray::before{
    content:"";
    position:absolute; inset:14px;
    border-radius:50%;
    border: 1.5px dashed var(--stitch);
  }
  .stage{
    position:absolute; inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective: 700px;
  }
  .die-shape{
    width:46%;
    height:46%;
    position:relative;
    transform-style: preserve-3d;
  }
  .die-shape svg{
    width:100%;
    height:100%;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,0.45));
  }
  .die-shape polygon, .die-shape path{
    fill: var(--ivory);
    stroke: var(--felt-2);
    stroke-width: 2.2;
    transition: fill .2s ease;
  }
  .result-number{
    font-family:'Fraunces', serif;
    font-weight:900;
    fill: var(--ink);
  }

  .die-shape.rolling{
    animation: tumble var(--roll-duration, 1.1s) cubic-bezier(.32,.05,.14,1) both;
  }
  @keyframes tumble{
    0%{ transform: rotate3d(1,1,0, 0deg) scale(1); }
    35%{ transform: rotate3d(1,1,0.3, 420deg) scale(1.08); }
    70%{ transform: rotate3d(0.6,1,0.2, 760deg) scale(0.96); }
    100%{ transform: rotate3d(0,1,0, 1080deg) scale(1); }
  }
  .die-shape.settle polygon, .die-shape.settle path{
    animation: flash 0.5s ease;
  }
  @keyframes flash{
    0%{ fill: var(--brass-bright); }
    100%{ fill: var(--ivory); }
  }

  /* d100 pair layout */
  .pair{ display:flex; gap:10px; align-items:center; justify-content:center; width:80%; height:80%; }
  .pair .die-shape{ width:46%; height:100%; }

  .caption{
    font-size:12px;
    color: var(--parchment);
    letter-spacing:.06em;
    text-transform:uppercase;
    margin-bottom: 14px;
    height:16px;
  }

  .actions{
    display:flex;
    gap:10px;
    width:100%;
    max-width:340px;
  }
  button.roll{
    flex:1;
    border:none;
    border-radius:999px;
    padding:14px 18px;
    font-family:'Space Grotesk';
    font-weight:700;
    font-size:15px;
    letter-spacing:.02em;
    background: linear-gradient(160deg, var(--brass-bright), var(--brass));
    color: #2a2005;
    box-shadow: 0 8px 20px rgba(201,162,39,0.25);
    cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease, opacity .2s ease;
  }
  button.roll:active{ transform: scale(0.97); }
  button.roll:disabled{ opacity:.55; cursor:default; transform:none; }

  button.send{
    flex:0 0 auto;
    border:1px solid rgba(242,232,213,0.22);
    background: rgba(255,255,255,0.03);
    color: var(--ivory);
    border-radius:999px;
    padding:14px 16px;
    font-family:'Space Grotesk';
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    transition: opacity .2s ease, border-color .2s ease;
  }
  button.send:disabled{ opacity:.35; cursor:default; }
  button.send.ready{ border-color: var(--brass); color: var(--brass-bright); }

  /* history strip */
  .history{
    margin-top:18px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:center;
    max-width:340px;
    min-height:26px;
  }
  .history .h-item{
    font-size:11px;
    font-weight:600;
    padding:4px 9px;
    border-radius:999px;
    background: rgba(242,232,213,0.06);
    color: var(--parchment);
    border:1px solid rgba(242,232,213,0.1);
  }
  .history .h-item b{ color: var(--brass-bright); font-weight:700;}
</style>
</head>
<body>

  <div class="eyebrow">Mesa de Dados</div>
  <h1>Lance seu dado</h1>
  <div class="sub">Escolha o dado e toque em lançar</div>

  <div class="selector" id="selector"></div>

  <div class="tray-wrap">
    <div class="tray"></div>
    <div class="stage" id="stage"></div>
  </div>

  <div class="caption" id="caption">&nbsp;</div>

  <div class="actions">
    <button class="roll" id="rollBtn">Lançar</button>
    <button class="send" id="sendBtn" disabled>Enviar ao chat</button>
  </div>

  <div class="history" id="history"></div>

<script>
(function(){
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); try{ tg.setHeaderColor('#0b2418'); }catch(e){} try{ tg.setBackgroundColor('#0b2418'); }catch(e){} }

  const DICE = [
    { id:'d4',  sides:4,   label:'D4',  duration:900,  shape:'triangle' },
    { id:'d6',  sides:6,   label:'D6',  duration:1000, shape:'square' },
    { id:'d8',  sides:8,   label:'D8',  duration:1100, shape:'octagon' },
    { id:'d10', sides:10,  label:'D10', duration:1150, shape:'kite' },
    { id:'d12', sides:12,  label:'D12', duration:1250, shape:'dodeca' },
    { id:'d20', sides:20,  label:'D20', duration:1400, shape:'icosa' },
    { id:'d100',sides:100, label:'D100',duration:1500, shape:'pair' },
  ];

  let current = DICE[1]; // d6 default
  let lastResult = null;
  let rolling = false;
  const history = [];

  const selectorEl = document.getElementById('selector');
  const stageEl = document.getElementById('stage');
  const captionEl = document.getElementById('caption');
  const rollBtn = document.getElementById('rollBtn');
  const sendBtn = document.getElementById('sendBtn');
  const historyEl = document.getElementById('history');

  function iconSvg(shape){
    // small chip icons, purely decorative
    const icons = {
      triangle: '<polygon points="10,2 18,17 2,17"/>',
      square:   '<rect x="3" y="3" width="14" height="14" rx="2"/>',
      octagon:  '<polygon points="6,2 14,2 18,6 18,14 14,18 6,18 2,14 2,6"/>',
      kite:     '<polygon points="10,1 18,8 10,19 2,8"/>',
      dodeca:   '<polygon points="10,1 15,4 18,9 16,15 10,19 4,15 2,9 5,4"/>',
      icosa:    '<circle cx="10" cy="10" r="8.5"/>',
      pair:     '<circle cx="6" cy="10" r="5.5"/><circle cx="14" cy="10" r="5.5"/>'
    };
    return `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4">${icons[shape]}</svg>`;
  }

  function buildChips(){
    selectorEl.innerHTML = '';
    DICE.forEach(d => {
      const chip = document.createElement('div');
      chip.className = 'chip' + (d.id === current.id ? ' active' : '');
      chip.dataset.id = d.id;
      chip.innerHTML = iconSvg(d.shape) + `<span>${d.label}</span>`;
      chip.addEventListener('click', () => {
        if (rolling) return;
        current = d;
        buildChips();
        renderStage(null);
        sendBtn.disabled = true;
        sendBtn.classList.remove('ready');
        lastResult = null;
        captionEl.textContent = '';
      });
      selectorEl.appendChild(chip);
    });
  }

  // shape polygon points per die, used for the big tray shape
  const SHAPES = {
    triangle: '50,10 90,85 10,85',
    square:   '15,15 85,15 85,85 15,85',
    octagon:  '32,10 68,10 90,32 90,68 68,90 32,90 10,68 10,32',
    kite:     '50,5 90,38 50,95 10,38',
    dodeca:   '50,4 73,12 90,30 96,54 84,76 62,92 38,92 16,76 4,54 10,30 27,12',
    icosa:    '50,6 78,20 92,48 80,78 50,94 20,78 8,48 22,20'
  };

  function singleDieSVG(shape, value, keyId){
    const points = SHAPES[shape];
    const fontSize = shape === 'triangle' ? 26 : 30;
    return `<svg viewBox="0 0 100 100">
      <polygon points="${points}"/>
      <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
        class="result-number" font-size="${fontSize}">${value === null ? '' : value}</text>
    </svg>`;
  }

  function renderStage(value){
    stageEl.innerHTML = '';
    if (current.shape === 'pair'){
      const wrap = document.createElement('div');
      wrap.className = 'pair';
      const tens = document.createElement('div');
      tens.className = 'die-shape';
      const units = document.createElement('div');
      units.className = 'die-shape';
      let tv = '', uv = '';
      if (value !== null){
        const v = value === 100 ? 100 : value;
        const vv = v === 100 ? '00' : String(v).padStart(2,'0');
        tv = vv[0]; uv = vv[1];
        if (v === 100) { tv = '0'; uv = '0'; } // 100 shown as 00 (classic percentile convention), noted in caption
      }
      tens.innerHTML = singleDieSVG('square', value === null ? null : tv);
      units.innerHTML = singleDieSVG('square', value === null ? null : uv);
      wrap.appendChild(tens);
      wrap.appendChild(units);
      stageEl.appendChild(wrap);
    } else {
      const die = document.createElement('div');
      die.className = 'die-shape';
      die.innerHTML = singleDieSVG(current.shape, value);
      stageEl.appendChild(die);
    }
  }

  function getDieShapeEls(){
    return stageEl.querySelectorAll('.die-shape');
  }

  function roll(){
    if (rolling) return;
    rolling = true;
    rollBtn.disabled = true;
    sendBtn.disabled = true;
    sendBtn.classList.remove('ready');
    captionEl.textContent = 'Rolando…';

    renderStage(null);
    const els = getDieShapeEls();
    els.forEach(el => {
      el.style.setProperty('--roll-duration', current.duration + 'ms');
      el.classList.add('rolling');
    });

    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('rigid');

    setTimeout(() => {
      const result = 1 + Math.floor(Math.random() * current.sides);
      lastResult = result;
      renderStage(result);
      const els2 = getDieShapeEls();
      els2.forEach(el => el.classList.add('settle'));
      rolling = false;
      rollBtn.disabled = false;
      sendBtn.disabled = false;
      sendBtn.classList.add('ready');
      captionEl.textContent = `${current.label} · resultado ${result}`;
      pushHistory(current.label, result);
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }, current.duration);
  }

  function pushHistory(label, value){
    history.unshift({ label, value });
    if (history.length > 8) history.pop();
    historyEl.innerHTML = history.map(h => `<span class="h-item">${h.label} <b>${h.value}</b></span>`).join('');
  }

  function sendToChat(){
    if (lastResult === null) return;
    const payload = { die: current.id, sides: current.sides, result: lastResult };
    if (tg && tg.sendData){
      tg.sendData(JSON.stringify(payload));
    } else {
      alert('Resultado: ' + current.label + ' → ' + lastResult + '\\n(Abra pelo Telegram para enviar ao chat.)');
    }
  }

  rollBtn.addEventListener('click', roll);
  sendBtn.addEventListener('click', sendToChat);

  buildChips();
  renderStage(null);
})();
</script>
</body>
</html>
